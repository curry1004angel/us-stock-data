name: 재무 데이터 수집 및 변화율 계산

on:
  schedule:
    # 매주 토요일 UTC 02:00 (yfinance로 최근 분기 갱신)
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 재무제표 수집 (yfinance)
        run: python scripts/fetch_financials.py

      - name: 주식수 스냅샷 수집
        run: python scripts/fetch_shares.py

      - name: QoQ/YoY 계산
        run: python scripts/calculate_changes.py

      # always()로 두는 이유. 재무제표 수집만 2시간이 걸리는데, 뒤 단계가 하나라도
      # 실패하면 커밋이 스킵되어 수집 결과가 통째로 버려진다. 커밋은 항상 실행하고
      # 실패한 단계 때문에 잡은 그대로 실패로 표시된다.
      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/financials/ data/screener/
          git diff --staged --quiet || git commit -m "재무 업데이트: $(date -u +%Y%m%d)"
          git pull --rebase
          git push
